<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spin 12</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;height:100vh;display:flex;flex-direction:column}.top{background:#0f0f0f;color:#fff;padding:8px 12px;display:flex;justify-content:space-between;font-size:14px}.bar{background:#2a1a0e;padding:5px 10px;display:flex;gap:6px;color:#fff;font-size:11px}.bar span{background:#3d2817;padding:4px 8px;border-radius:10px}.table{flex:1;background:#c68642;background-image:linear-gradient(90deg, rgba(0,0,0,.06) 1px, transparent 1px), linear-gradient(#d49a5a,#a66d3a);background-size:40px 100%, 100% 100%;position:relative}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:150px;height:150px;background:radial-gradient(#f3d5a3,#c9986b);border-radius:22px;box-shadow:0 0 0 10px rgba(90,50,20,.25), inset 0 0 18px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}.bottle{width:32px;height:88px;background:linear-gradient(90deg,#167a35,#2ecc71);border-radius:5px 5px 10px 10px;position:relative;transition:transform 3s cubic-bezier(.25,.8,.25,1);box-shadow:0 4px 10px #0009}.bottle:before{content:'';position:absolute;top:-10px;left:50%;transform:translateX(-50%);width:12px;height:12px;background:#167a35;border-radius:2px}.player{position:absolute;width:70px;text-align:center}.ava{width:58px;height:58px;border-radius:10px;background:#111;border:2px solid #555;overflow:hidden;margin:auto;box-shadow:0 3px 8px #0007}.ava img{width:100%;height:100%;object-fit:cover}.ava.gold{border-color:#ffd700;box-shadow:0 0 10px gold}.name{font-size:8px;color:#fff;background:rgba(0,0,0,.65);padding:2px 4px;border-radius:8px;margin-top:2px;white-space:nowrap;overflow:hidden}.status{position:absolute;left:50%;top:42%;transform:translateX(-50%);background:rgba(0,0,0,.6);color:#fff;padding:6px 14px;border-radius:16px;font-size:11px;z-index:5;text-align:center}.chat{background:#fff;height:30%;display:flex;flex-direction:column}.msgs{flex:1;overflow:auto;padding:6px;font-size:12px}.input{display:flex;padding:6px;gap:6px;border-top:1px solid #eee}.input input{flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:20px}.input button{background:#ff9800;border:0;width:32px;height:32px;border-radius:50%;color:#fff}.pop{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99}.box{background:#fff;padding:18px;border-radius:16px;width:85%;max-width:300px;text-align:center}</style></head><body><div class="top"><span>✕ Spin the Bottle 🍾❤️</span><span>12 nəfər</span></div><div class="bar"><span>❤️ 4</span><span>⚙️</span><span>👑</span><span>🎁</span><span style="margin-left:auto">Masa 1/8</span></div><div class="table" id="t"><div class="status" id="st">Sonraki sırayı<br>bekliyoruz</div><div class="center"><div class="bottle" id="b"></div></
