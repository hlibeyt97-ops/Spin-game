<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spin 12 Final</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{height:100vh;display:flex;flex-direction:column;background:#000}.top{height:54px;background:#d19a5e;display:flex;justify-content:space-between;align-items:center;padding:0 12px;color:#fff;font-size:13px}.table{flex:1;background:#d9a86c url('https://images.unsplash.com/photo-1541123437800-1bb1317badc2?w=800') center/cover;position:relative}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:240px;height:240px;background:radial-gradient(circle,#f5d6a0 0%, #e8b87a 60%);border-radius:40%;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 25px rgba(90,50,20,.4);clip-path:ellipse(48% 45% at 50% 50%)}.bottle{width:42px;height:115px;background:linear-gradient(90deg,#0a4d20,#3de07f,#0a4d20);border-radius:7px 7px 16px 16px;position:relative;transition:transform 3s;box-shadow:0 8px 20px #0008}.player{position:absolute;width:70px;text-align:center;z-index:10}.ava{width:64px;height:64px;border-radius:12px;background:#222;border:2px solid #333;overflow:hidden;margin:auto;box-shadow:0 4px 10px #0006}.ava img{width:100%;height:100%;object-fit:cover}.name{font-size:10px;color:#fff;background:rgba(0,0,0,.6);padding:2px 4px;border-radius:8px;margin-top:2px;white-space:nowrap}.st{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);background:rgba(0,0,0,.7);color:#fff;padding:10px 18px;border-radius:18px;font-size:15px;font-weight:bold;text-align:center;z-index:20;text-shadow:0 2px 6px #000}.chat{background:#fff;height:32%;display:flex;flex-direction:column}.msgs{flex:1;overflow:auto;padding:8px;font-size:12px}.inp{display:flex;padding:8px;gap:6px;border-top:1px solid #ddd}.inp input{flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:20px}.inp button{background:#8bc34a;border:0;width:32px;height:32px;border-radius:8px;color:#fff}.pop{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99}.box{background:#fff;padding:20px;border-radius:16px;width:85%;text-align:center}</style></head><body><div class="top"><span>❤️ 67 💊 ◎ 🏆 ☰ ⚙️</span><span>Стол 1905</span></div><div class="table" id="t"><div class="st" id="st">Ждем девушек<br>для начала игры</div><div class="center"><div class="bottle" id="b"></div></div>
<div class="player" style="left:2%;top:4%"><div class="ava"><img src="https://i.pravatar.cc/150?img=15"></div><div class="name">Из Далека, 60</div></div>

<div class="player" style="left:38%;top:3%"><div class="ava" style="background:#d35400;color:#fff;display:flex;align-items:center;justify-content:center">A</div><div class="name">Aynur</div></div>
<div class="player" style="left:56%;top:4%"><div class="ava" style="background:#2980b9;color:#fff;display:flex;align-items:center;justify-content:center">M</div><div class="name">Murad</div></div>

</div><div class="chat"><div class="msgs" id="m"><div>🎵 Kefli поставил мелодию</div></div><div class="inp"><input id="i" placeholder="Написать сообщение"><button onclick="sm()">✉️</button></div></div><div class="pop" id="p"><div class="box"><h3 id="pt"></h3><div id="pa" style="margin:12px 0;font-size:28px"></div><button onclick="ch(1)" style="background:#ff1744;color:#fff;padding:10px 20px;border:0;border-radius:20px">Öp</button><button onclick="ch(0)" style="background:#ddd;padding:10px 20px;border:0;border-radius:20px">Pas</button></div></div><script>let ang=0,sp=false;const b=document.getElementById('b'),st=document.getElementById('st'),t=document.getElementById('t');function spin(){if(sp)return;sp=true;st.style.display='none';ang+=1080+Math.random()*800;b.style.transform='rotate('+ang+'deg)';setTimeout(()=>{let n=["Из Далека","88","Kefli","Elnur","Aynur","Murad","Sevda","Roya","Elvin","Nigar","Kamran","Leyla"];let a=n[Math.floor(Math.random()*12)];let c=n[(Math.floor(Math.random()*12)+1)%12];document.getElementById('pt').textContent=a+' ❤️ '+c;document.getElementById('pa').textContent=a+' 💋 '+c;document.getElementById('p').style.display='flex';sp=false},3000)}function ch(y){document.getElementById('p').style.display='none';setTimeout(()=>{st.style.display='block'},1000)}t.addEventListener('click',spin);function sm(){let inp=document.getElementById('i');if(!inp.value.trim())return;let m=document.getElementById('m');let d=document.createElement('div');d.textContent='Вы: '+inp.value;m.appendChild(d);inp.value=''}document.getElementById('i').addEventListener('keydown',e=>{if(e.key==='Enter')sm()})</script></body></html>
