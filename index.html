<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spin Bottle 12</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}body{background:#111;height:100vh;display:flex;flex-direction:column}.h{background:#000;color:#fff;padding:10px 15px;display:flex;justify-content:space-between;font-size:15px}.t{flex:1;background:radial-gradient(#e8c39a,#8B5A2B);position:relative;overflow:hidden}#b{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:70px;height:120px;background:#2e8b57;border-radius:20px 20px 10px 10px;display:flex;align-items:center;justify-content:center;font-size:40px;transition:transform 3s;box-shadow:0 10px 20px #0008;z-index:10}.s{position:absolute;width:64px;height:64px;text-align:center;transform:translate(-50%,-50%)}.a{width:54px;height:54px;border-radius:12px;border:3px solid gold;background:#333;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;margin:auto;box-shadow:0 3px 8px #0006}.n{font-size:9px;color:#fff;background:#0009;padding:2px 4px;border-radius:8px;margin-top:3px;white-space:nowrap}.s.on .a{border-color:#ff1744;box-shadow:0 0 15px red;transform:scale(1.2)}.st{position:absolute;left:50%;top:32%;transform:translateX(-50%);background:#0008;color:#fff;padding:6px 14px;border-radius:20px;font-size:13px;z-index:5;white-space:nowrap}.c{background:#fff;height:32%;display:flex;flex-direction:column}.m{flex:1;overflow:auto;padding:8px;font-size:13px}.i{display:flex;padding:8px;gap:6px;border-top:1px solid #ddd}.i input{flex:1;padding:9px 12px;border:1px solid #ddd;border-radius:20px}.i button{background:#ff9800;color:#fff;border:0;width:34px;height:34px;border-radius:50%}.p{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:99}.pb{background:#fff;padding:20px;border-radius:20px;text-align:center;width:85%}</style></head><body><div class="h"><span>✕ Spin 🍾❤️</span><span>12 nəfər</span></div><div class="t" id="t"><div id="b">🍾</div><div class="st" id="st">Ortaya bas, fırlansın!</div></div><div class="c"><div class="m" id="m"><div>Sistem: Oyun başladı - 12 nəfər masada!</div></div><div class="i"><input id="inp" placeholder="Mesaj yaz"><button onclick="sm()">➤</button></div></div><div class="p" id="pp"><div class="pb"><h3 id="pt"></h3><div id="pa" style="display:flex;justify-content:center;gap:20px;margin:12px 0;font-size:30px"></div><button onclick="cp(1)" style="background:#ff1744;color:#fff;padding:10px 20px;border:0;border-radius:20px;margin:5px">Öp ❤️</button><button onclick="cp(0)" style="background:#ddd;padding:10px 20px;border:0;border-radius:20px;margin:5px">Pas</button></div></div><script>const em=["👨‍💼","👩‍🦰","👨‍🎤","👩‍🎨","👸","🤵","👩‍💻","👨‍💻","👩‍❤️‍👨","👨‍🦱","👧","👦"],nm=["Elnur","Aynur","Murad","Sevda","Roya","Elvin","Nigar","Kamran","Leyla","Orxan","Aysel","Tural"],t=document.getElementById('t'),se=[];function cs(){let r=130;if(window.innerWidth<350)r=105;for(let i=0;i<12;i++){let a=(i/12)*6.283-1.57,x=Math.cos(a)*r,y=Math.sin(a)*r,d=document.createElement('div');d.className='s';d.style.left=(50+x*0.62)+'%';d.style.top=(50+y*0.38)+'%';d.innerHTML=`<div class="a">${em[i]}</div><div class="n">${nm[i]}</div>`;t.appendChild(d);se.push(d)}}cs();let ag=0,sp=0;const b=document.getElementById('b'),st=document.getElementById('st');function spin(){if(sp)return;sp=1;st.textContent='Fırlanır...';ag+=1080+Math.random()*1000;b.style.transform=`translate(-50%,-50%) rotate(${ag}deg)`;se.forEach(s=>s.classList.remove('on'));setTimeout(()=>{let c=Math.round((ag%360)/30)%12;c=(12-c)%12;se[c].classList.add('on');sk(c);sp=0;st.textContent=nm[c]+' seçildi!'},3000)}b.onclick=spin;t.onclick=spin;function sk(i){let o=(i+1)%12;document.getElementById('pt').textContent=nm[i]+' ❤️ '+nm[o];document.getElementById('pa').innerHTML=`<div>${em[i]}<br><small>${nm[i]}</small></div><div>💋</div><div>${em[o]}<br><small>${nm[o]}</small></div>`;document.getElementById('pp').style.display='flex';am('Şişe '+nm[i]+' seçti')}function cp(y){document.getElementById('pp').style.display='none';am(y?'💋 Öpüşme oldu!':'Pas geçildi');setTimeout(()=>{st.textContent='Ortaya bas, fırlansın!';se.forEach(s=>s.classList.remove('on'))},1500)}function am(tt){let m=document.getElementById('m'),d=document.createElement('div');d.textContent=tt;m.appendChild(d);m.scrollTop=m.scrollHeight}function sm(){let inp=document.getElementById('inp');if(!inp.value.trim())return;am('Sen: '+inp.value);inp.value=''}document.getElementById('inp').addEventListener('keydown',e=>{if(e.key=='Enter')sm()})</script></body></html>
