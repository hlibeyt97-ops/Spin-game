<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;height:100vh;display:flex;flex-direction:column}

.bottle:before{content:'';position:absolute;top:-12px;left:50%;margin-left:-6px;width:12px;height:14px;background:#0d6b2e;border-radius:2px}
.player{position:absolute;width:64px;text-align:center}
.ava{width:58px;height:58px;border-radius:12px;background:#222;color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:bold;border:2px solid #333}
.name{font-size:9px;color:#fff;background:rgba(0,0,0,.6);padding:2px 4px;border-radius:8px;margin-top:3px}
.st{position:absolute;left:50%;top:38%;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;padding:8px 14px;border-radius:16px;font-size:12px;text-align:center;z-index:10}
.chat{background:#fff;height:28%;display:flex;flex-direction:column}
.ms{flex:1;overflow:auto;padding:6px;font-size:12px}
.inp{display:flex;padding:6px;gap:6px;border-top:1px solid #ddd}
.inp input{flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:20px}
.inp button{background:#8bc34a;border:0;width:32px;height:32px;border-radius:6px;color:#fff}
.pop{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:99}
.box{background:#fff;padding:20px;border-radius:16px;width:85%;text-align:center}
</style>
</head>
